<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>PlantID design comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px; color: #fff; background: #151515; font: 600 14px Arial, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 8px; letter-spacing: .08em; text-transform: uppercase; }
      img { display: block; width: 100%; height: auto; border: 1px solid #404040; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Source visual</figcaption>
        <img src="source-living-gallery.png" alt="Selected Living Gallery design">
      </figure>
      <figure>
        <figcaption>Implementation v2</figcaption>
        <img src="implementation-desktop-v2.png" alt="Current PlantID implementation">
      </figure>
    </main>
  </body>
</html>
